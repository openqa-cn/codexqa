name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
      - name: Install packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y rsync zip unzip
      - name: Check documentation and skill registry
        run: python3 scripts/check-docs.py
      - name: Verify known-good and seeded-defect example
        run: node examples/checkout-boundary/verify.mjs
      - name: Verify blind-evaluation fixture answer key
        run: node examples/inventory-service/verify.mjs
      - name: Build polyglot fixture
        run: node examples/polyglot-service/make-git-fixture.mjs
      - name: Run skill tests
        working-directory: skills/defect-detection
        run: npm test
