name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove customer code, credentials, and private data.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, environment, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
