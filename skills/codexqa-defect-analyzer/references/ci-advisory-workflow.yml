name: codexqa-defect-analyzer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Low-frequency baseline (full); daily/PR traffic stays incremental
  schedule:
    - cron: '0 3 * * 1'   # weekly full baseline Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental or full'
        required: true
        default: 'incremental'

jobs:
  defect-scan:
    runs-on: ubuntu-latest
    # Non-blocking advisory smoke — does NOT gate merge.
    # Intentionally uses CODEXQA_FORCE_MOCK + --dry-run (mock graph + mock LLM).
    # This is NOT a production-grade live scan; see SKILL.md "CI" section.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CodexQA CLI
        run: |
          npm install -g @openqa-cn/codexqa --registry https://registry.npmjs.org/ || true
          echo "PATH=$(npm prefix -g)/bin:$HOME/.local/bin:$HOME/go/bin:$PATH" >> "$GITHUB_ENV"
          codexqa --help || echo "CodexQA platform binary unavailable; advisory job uses FORCE_MOCK"

      - name: Install OOTB scan tools (repair then continue)
        run: |
          chmod +x scripts/install_sast_tools.sh
          python3 scripts/ensure_tools.py --repo . || true
          # degraded tooling must not fail the advisory job
        env:
          PATH: /home/runner/.local/bin:/home/runner/go/bin:/usr/local/bin:/usr/bin:/bin

      - name: Run tests (before scan)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if [ -d tests ]; then python -m pytest -q || true; fi

      - name: Resolve scan mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: AI defect detection (advisory smoke — mock CodexQA + mock LLM)
        env:
          # Advisory only: mock call-graph. Do not treat artifact as live CodexQA evidence.
          CODEXQA_FORCE_MOCK: "1"
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          # --dry-run = heuristic mock LLM (no agent session / no API key)
          if [ "$MODE" = "full" ]; then
            python3 scripts/run_scan.py full --repo . --llm-mode dry-run -o /tmp/aid_report || true
          else
            BASE="origin/${{ github.base_ref }}"
            [ -z "${{ github.base_ref }}" ] && BASE="HEAD~1"
            python3 scripts/run_scan.py incremental \
              --repo . \
              --base "$BASE" \
              --intent "${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}" \
              --llm-mode dry-run \
              -o /tmp/aid_report || true
          fi

      - name: Upload advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codexqa-defect-analyzer-report
          path: /tmp/aid_report/
          if-no-files-found: ignore
