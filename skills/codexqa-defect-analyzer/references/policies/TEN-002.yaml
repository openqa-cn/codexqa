id: TEN-002
version: 1
status: active
category: security
severity_default: P0
title: Object lookup missing tenant predicate
look_for: |
  get/filter by resource id (or list/join/pagination) without tenant_id /
  org_id in the query — cross-tenant row leak. Residual after SAST: join or
  nested include drops the tenant clause.
do_not_report: |
  Query always ANDs tenant from server context; RLS enforced for the request
  role; truly global catalog tables.
suggestion_hint: Include tenant_id from authenticated membership in every tenant-owned lookup.
fixtures:
  positive:
    - name: get_by_id
      language: python
      file: saas/repo.py
      code: |
        def get_doc(db, doc_id):
            return db.docs.get(id=doc_id)
      expect:
        should_find: true
        category: security
  negative:
    - name: get_by_id_and_tenant
      language: python
      file: saas/repo.py
      code: |
        def get_doc(db, doc_id, tenant_id):
            return db.docs.get(id=doc_id, tenant_id=tenant_id)
      expect:
        should_find: false
