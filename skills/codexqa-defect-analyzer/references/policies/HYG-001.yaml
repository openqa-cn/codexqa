id: HYG-001
version: 1
status: active
category: hygiene
severity_default: P2
title: Sensitive data logged or shell=True with dynamic input
look_for: |
  Logging tokens/passwords/PII; subprocess with shell=True and interpolated user input;
  debug prints of secrets in changed code.
do_not_report: |
  Clear secret findings already in deterministic/gitleaks clear list; redacted logging helpers.
suggestion_hint: Redact secrets; avoid shell=True; use argv lists for subprocess.
fixtures:
  positive:
    - name: log_token
      language: python
      file: svc/auth.py
      code: |
        def login(token):
            print("user token=", token)
            return True
      expect:
        should_find: true
        category: hygiene
  negative:
    - name: redacted_log
      language: python
      file: svc/auth.py
      code: |
        def login(token):
            print("user token=***")
            return True
      expect:
        should_find: false
