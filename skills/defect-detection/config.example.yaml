# Copy to config.yaml or set DETECTION_CONFIG to this file.
# Every provider kind is "local" so the skill runs without a private backend.

# Relative paths are resolved against this config file (not the shell's cwd),
# so every task and report lands in the same place however detect.ts is invoked.
data_dir: ./data
enterprise_dir: ./enterprise
default_user: local-user
# Optional UI link template. Empty → write data/platform/reports/{id}.html and use file://
report_base_url: ""
# Shared HTTP gateway for plan / testcase / issues / docs / traces when a
# provider sets kind=http but omits its own options.base_url.
# Env override: DETECTION_ENTERPRISE_BASE_URL
enterprise_http_base_url: ""

providers:
  auth:
    kind: none          # none | bearer | api_key
    options: {}
  platform:
    kind: local         # local | http
    options:
      # base_url: https://quality.example.com
      # report_base_url: https://quality.example.com/ui/report
  plan:
    kind: local         # local | http   local → enterprise/plans/{id}.json
    options: {}
    # kind: http
    # options:
    #   base_url: https://qa.example.com
    #   timeout: 30
    #   paths:                          # remap reserved slots; see references/api/enterprise-http-api.md
    #     get_plan: /v1/plans/{plan_id}
    #     list_submitted_defects: /v1/plans/{plan_id}/defects
  testcase:
    kind: local         # local | http   local → enterprise/test-cases/
    options: {}
    # kind: http
    # options:
    #   base_url: https://cases.example.com
    #   paths:
    #     list_groups: /v1/test-case-groups
    #     list_cases: /v1/test-cases
    #     get_case: /v1/test-cases/{case_id}
  issues:
    kind: local         # local | github | http   local → enterprise/issues/
    options:
      # repo: your-org/your-repo   # for kind=github
    # kind: http
    # options:
    #   base_url: https://tickets.example.com
    #   paths:
    #     get_issue: /v1/issues/{issue_id}
    #     create_issue: /v1/issues
  docs:
    kind: local         # local | http   local → enterprise/docs/ or public URL
    options: {}
    # kind: http
    # options:
    #   base_url: https://wiki.example.com
    #   paths:
    #     fetch: /v1/documents/{doc_id}
  traces:
    kind: local         # local | http   local → enterprise/traces/{planId}.json
    options: {}
    # kind: http
    # options:
    #   base_url: https://observe.example.com
    #   paths:
    #     list_traces: /v1/plans/{plan_id}/traces
